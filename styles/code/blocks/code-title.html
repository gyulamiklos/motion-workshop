<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Code title</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0d1117; }
    </style>
  </head>
  <body>
    <!-- Chapter or film title in the editor: a comment kicker types on, the title types on behind a block
         caret, the subtitle fades up, and a large glyph sits dim at the right. The caret blinks on the
         timeline (0.5 s on, 0.5 s off) and stops on the last word. -->
    <div
      id="ct-root"
      data-composition-id="code-title"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="4"
      data-composition-variables='[
        {"id":"kicker","type":"string","label":"Kicker (index or chapter)","default":"-- 01 / 05"},
        {"id":"title","type":"string","label":"Title","default":"Pure functions"},
        {"id":"subtitle","type":"string","label":"Subtitle","default":"Same input, same output. Nothing else changes."},
        {"id":"glyph","type":"string","label":"Background glyph","default":"λ"}
      ]'
    >
      <div id="ct-clip" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div id="ct-bg"></div>
        <div id="ct-glyph"></div>
        <div id="ct-col">
          <div id="ct-kicker"></div>
          <div id="ct-title"><span id="ct-text"></span><i id="ct-caret"></i></div>
          <div id="ct-sub"></div>
        </div>
      </div>

      <style>
        #ct-root { position: absolute; inset: 0; font-family: 'JetBrains Mono', monospace; }
        #ct-clip { position: absolute; inset: 0; overflow: hidden; }
        #ct-bg { position: absolute; inset: 0; background: radial-gradient(ellipse 55% 60% at 78% 50%, rgba(199,146,234,0.10) 0%, rgba(199,146,234,0) 70%), #0d1117; }
        #ct-glyph { position: absolute; right: 150px; top: 50%; transform: translateY(-52%); font-size: 640px; line-height: 1; color: #c792ea; opacity: 0.12; }
        #ct-col { position: absolute; left: 200px; top: 50%; transform: translateY(-50%); width: 1300px; display: flex; flex-direction: column; gap: 34px; }
        #ct-kicker { font-size: 32px; color: #6e7681; }
        #ct-title { position: relative; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 132px; line-height: 1.04; letter-spacing: -0.035em; color: #e6edf3; }
        #ct-text { white-space: pre-wrap; }
        #ct-text span { display: inline; }
        #ct-caret { position: absolute; left: 0; top: 0; width: 0.09em; height: 0.82em; background: #ffcb6b; }
        #ct-sub { font-family: 'Inter', sans-serif; font-size: 44px; line-height: 1.3; color: #8b949e; max-width: 1100px; }
      </style>

      <script>
        (function () {
          "use strict";
          function readVars() {
            var out = {};
            try { JSON.parse(document.getElementById("ct-root").getAttribute("data-composition-variables")).forEach(function (d) { out[d.id] = d.default; }); } catch (e) {}
            var hf = window.__hyperframes;
            var over = hf && typeof hf.getVariables === "function" ? hf.getVariables() : window.__hfVariables;
            if (over && typeof over === "object") for (var k in over) if (over[k] !== undefined) out[k] = over[k];
            return out;
          }
          var v = readVars();
          document.getElementById("ct-kicker").textContent = v.kicker || "";
          document.getElementById("ct-sub").textContent = v.subtitle || "";
          document.getElementById("ct-glyph").textContent = v.glyph || "";
          var text = document.getElementById("ct-text");
          var chars = String(v.title || "").split("").map(function (ch) {
            var s = document.createElement("span"); s.textContent = ch; text.appendChild(s); return s;
          });

          var CPS = 0.045; // seconds a character
          var tl = gsap.timeline({ paused: true });
          // the glyph and the kicker are on screen at 0 s (the first frame is the thumbnail); the glyph drifts in
          tl.fromTo("#ct-glyph", { x: 40 }, { x: 0, duration: 1.6, ease: "power3.out" }, 0);
                    // the caret sits after the last typed character (the title may wrap, so it follows x and y)
          var caretH = document.getElementById("ct-caret").offsetHeight;
          function at(c) { return { x: c.offsetLeft + c.offsetWidth + 6, y: c.offsetTop + (c.offsetHeight - caretH) / 2 }; }
          gsap.set("#ct-caret", chars.length ? { x: chars[0].offsetLeft, y: at(chars[0]).y } : { opacity: 0 });
          chars.forEach(function (c, i) {
            tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.45 + i * CPS);
            tl.set("#ct-caret", at(c), 0.45 + i * CPS);
          });
          var typed = 0.45 + chars.length * CPS;
          tl.fromTo("#ct-sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, typed + 0.2);
          // caret: solid while typing, then blinks for the rest of the 4 s slot
          for (var t = typed + 0.5; t < 3.9; t += 1) {
            tl.set("#ct-caret", { opacity: 0 }, t);
            tl.set("#ct-caret", { opacity: 1 }, t + 0.5);
          }
          window.__timelines = window.__timelines || {};
          window.__timelines["code-title"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
