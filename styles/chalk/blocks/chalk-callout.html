<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Chalk callout</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Caveat'; src: url('assets/fonts/Caveat.ttf') format('truetype'); font-weight: 400 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #1e2a26; }
    </style>
  </head>
  <body>
    <!-- The teacher's move: a line is written on the board, one part of it is circled in coloured chalk,
         an arrow swoops down from the circle and a note is written at its end. The circle overshoots its
         start like a hand does; the chalk edge boils 8 times a second. -->
    <div
      id="kc-root"
      data-composition-id="chalk-callout"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="7"
      data-composition-variables='[
        {"id":"text","type":"string","label":"Line on the board","default":"map (*2) [1, 2, 3]"},
        {"id":"target","type":"string","label":"Part to circle (a substring of the line)","default":"(*2)"},
        {"id":"note","type":"string","label":"Note at the arrow","default":"egy függvény is lehet paraméter"},
        {"id":"result","type":"string","label":"Optional second line (the result)","default":"= [2, 4, 6]"},
        {"id":"accent","type":"color","label":"Accent chalk","default":"#f2d16b"}
      ]'
    >
      <div id="kc-clip" class="clip" data-start="0" data-duration="7" data-track-index="0">
        <svg width="0" height="0" style="position:absolute">
          <filter id="kc-chalk" x="-5%" y="-10%" width="110%" height="120%">
            <feTurbulence id="kc-grain" type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="1" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="d" />
            <feComponentTransfer in="n" result="holes"><feFuncA type="discrete" tableValues="1 1 1 0.55 1 0.75 1" /></feComponentTransfer>
            <feComposite in="d" in2="holes" operator="in" />
          </filter>
        </svg>
        <div id="kc-board"></div>
        <div id="kc-ink" data-layout-allow-overlap>
          <div id="kc-line"></div>
          <div id="kc-result"></div>
          <svg id="kc-draw" width="1920" height="1080" viewBox="0 0 1920 1080">
            <path id="kc-ring" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7" />
            <path id="kc-arrow" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7" />
            <path id="kc-head" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7" />
          </svg>
          <div id="kc-note"></div>
        </div>
      </div>

      <style>
        #kc-root { position: absolute; inset: 0; font-family: 'Caveat', cursive; }
        #kc-clip { position: absolute; inset: 0; overflow: hidden; }
        #kc-board { position: absolute; inset: 0;
          background:
            radial-gradient(ellipse 38% 22% at 34% 28%, rgba(237,234,224,0.05) 0%, rgba(237,234,224,0) 70%),
            radial-gradient(ellipse 30% 18% at 70% 76%, rgba(237,234,224,0.045) 0%, rgba(237,234,224,0) 70%),
            radial-gradient(ellipse 90% 80% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.35) 100%),
            #1e2a26; }
        #kc-ink { position: absolute; inset: 0; filter: url(#kc-chalk); }
        #kc-draw { position: absolute; left: 0; top: 0; overflow: visible; }
        #kc-line, #kc-result { position: absolute; left: 240px; font-size: 132px; font-weight: 600; line-height: 1; color: #edeae0; white-space: pre; }
        #kc-line { top: 250px; }
        #kc-result { top: 400px; color: rgba(237,234,224,0.8); }
        #kc-note { position: absolute; font-size: 76px; font-weight: 500; line-height: 1.05; color: var(--kc-acc, #f2d16b); max-width: 760px; }
        .kc-word { display: inline-block; white-space: nowrap; }
        .kc-word span, #kc-line span, #kc-result span { display: inline-block; }
      </style>

      <script>
        (function () {
          "use strict";
          function readVars() {
            var out = {};
            try { JSON.parse(document.getElementById("kc-root").getAttribute("data-composition-variables")).forEach(function (d) { out[d.id] = d.default; }); } catch (e) {}
            var hf = window.__hyperframes;
            var over = hf && typeof hf.getVariables === "function" ? hf.getVariables() : window.__hfVariables;
            if (over && typeof over === "object") for (var k in over) if (over[k] !== undefined) out[k] = over[k];
            return out;
          }
          function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
          function chars(el, text) {
            return String(text || "").split("").map(function (ch) { var s = document.createElement("span"); s.textContent = ch === " " ? " " : ch; el.appendChild(s); return s; });
          }
          // letters inside word boxes, so the note only breaks between words
          function letters(el, text) {
            var out = [];
            String(text || "").split(" ").forEach(function (word, i) {
              if (i) el.appendChild(document.createTextNode(" "));
              var w = document.createElement("span"); w.className = "kc-word"; el.appendChild(w);
              word.split("").forEach(function (ch) { var s = document.createElement("span"); s.textContent = ch; w.appendChild(s); out.push(s); });
            });
            return out;
          }
          // the elements' box in frame pixels (the preview may scale or offset the scene)
          function box(els) {
            var f = document.getElementById("kc-clip").getBoundingClientRect(), k = f.width / 1920 || 1;
            var r = els.map(function (e) { return e.getBoundingClientRect(); });
            var px = function (vals, o) { return vals.map(function (x) { return (x - o) / k; }); };
            return { l: Math.min.apply(null, px(r.map(function (b) { return b.left; }), f.left)), r: Math.max.apply(null, px(r.map(function (b) { return b.right; }), f.left)),
              t: Math.min.apply(null, px(r.map(function (b) { return b.top; }), f.top)), b: Math.max.apply(null, px(r.map(function (b) { return b.bottom; }), f.top)) };
          }
          function draw(path, d, color) {
            path.setAttribute("d", d); path.setAttribute("stroke", color);
            var len = path.getTotalLength() || 400;
            gsap.set(path, { strokeDasharray: len, strokeDashoffset: len, opacity: 0 });
          }

          var v = readVars();
          var acc = v.accent;
          document.getElementById("kc-root").style.setProperty("--kc-acc", acc);
          var text = String(v.text || ""), target = String(v.target || "");
          var line = chars(document.getElementById("kc-line"), text);
          var result = chars(document.getElementById("kc-result"), v.result);
          var noteEl = document.getElementById("kc-note");
          var note = letters(noteEl, v.note);

          // the ring: an ellipse around the target that starts at 10 o'clock and runs ~1.15 turns
          var at = target ? text.indexOf(target) : -1;
          var r = rng(11);
          var ring = document.getElementById("kc-ring"), arrow = document.getElementById("kc-arrow"), head = document.getElementById("kc-head");
          var hasRing = at >= 0 && target.length > 0;
          var cx = 960, cy = 540, rx = 100, ry = 60;
          if (hasRing) {
            var b = box(line.slice(at, at + target.length));
            cx = (b.l + b.r) / 2; cy = (b.t + b.b) / 2 + 6; rx = (b.r - b.l) / 2 + 34; ry = (b.b - b.t) / 2 + 10;
            var pts = [], a0 = Math.PI * 1.15, turns = 1.15, N = 40;
            for (var i = 0; i <= N; i++) {
              var a = a0 + turns * Math.PI * 2 * i / N, k = 1 + (r() - 0.5) * 0.05 + (i / N) * 0.06;
              pts.push((cx + Math.cos(a) * rx * k).toFixed(1) + "," + (cy + Math.sin(a) * ry * k).toFixed(1));
            }
            draw(ring, "M" + pts.join(" L"), acc);
          }
          // the arrow leaves the ring low on its right, passes right of the result line (written later),
          // and ends at the note, lower right; the note keeps inside the title-safe box
          var resRight = result.length ? box(result).r : 0;
          var X = Math.min(Math.max(cx + rx + 30, resRight + 60), 1728 - 760 - 90);
          var sx = cx + rx * 0.55, sy = cy + ry * 0.85, ex = X + 60, ey = 730;
          noteEl.style.left = (ex + 30) + "px"; noteEl.style.top = (ey - 48) + "px";
          if (hasRing) {
            draw(arrow, "M" + sx + "," + sy + " C" + X + "," + (sy + 40) + " " + (X - 20) + "," + (ey - 60) + " " + ex + "," + ey, acc);
            draw(head, "M" + (ex - 34) + "," + (ey - 22) + " L" + ex + "," + ey + " L" + (ex - 30) + "," + (ey + 26), acc);
          }

          // a wipe inside each letter; the box is padded because Caveat glyphs and accents overhang their advance box
          var WIPE_FROM = "inset(-60% 130% -40% -30%)", WIPE_TO = "inset(-60% -30% -40% -30%)";
          var tl = gsap.timeline({ paused: true });
          var t = 0.2;
          line.forEach(function (c, i) {
            tl.fromTo(c, { clipPath: WIPE_FROM }, { clipPath: WIPE_TO, duration: 0.09, ease: "none" }, t + i * 0.055);
          });
          t += line.length * 0.055 + 0.5;
          if (hasRing) {
            tl.set(ring, { opacity: 1 }, t); tl.to(ring, { strokeDashoffset: 0, duration: 0.6, ease: "power1.inOut" }, t);
            tl.set(arrow, { opacity: 1 }, t + 0.7); tl.to(arrow, { strokeDashoffset: 0, duration: 0.45, ease: "power2.in" }, t + 0.7);
            tl.set(head, { opacity: 1 }, t + 1.15); tl.to(head, { strokeDashoffset: 0, duration: 0.15, ease: "none" }, t + 1.15);
            t += 1.35;
          }
          note.forEach(function (c, i) {
            tl.fromTo(c, { clipPath: WIPE_FROM }, { clipPath: WIPE_TO, duration: 0.07, ease: "none" }, t + i * 0.035);
          });
          t += note.length * 0.035 + 0.5;
          result.forEach(function (c, i) {
            tl.fromTo(c, { clipPath: WIPE_FROM }, { clipPath: WIPE_TO, duration: 0.09, ease: "none" }, t + i * 0.055);
          });
          var end = Math.max(7, t + result.length * 0.055 + 1);
          for (var bt = 0, s = 2; bt < end; bt += 0.125, s++) tl.set("#kc-grain", { attr: { seed: s % 5 + 1 } }, bt);
          window.__timelines = window.__timelines || {};
          window.__timelines["chalk-callout"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
